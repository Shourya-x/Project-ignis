; PlatformIO Project Configuration File
; IGNIS Flight Computer - STM32F411CEU6 Black Pill
; Using ST-Link programmer (instead of DFU)

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino

; Upload settings for ST-Link
upload_protocol = stlink
debug_tool = stlink

; Serial monitor
monitor_speed = 115200

; Build flags - USB CDC + 25 MHz crystal
build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D HAL_PCD_MODULE_ENABLED
    -D HSE_VALUE=25000000
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740
    -D USB_MANUFACTURER="\"STM32\""
    -D USB_PRODUCT="\"IGNIS Flight Computer\""

; Libraries
lib_deps = 
    adafruit/Adafruit NeoPixel